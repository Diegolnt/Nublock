[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nublock"
version = "0.1.0"
description = "Local-first activity tracker y bloqueador de distracciones (self-monitoring)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "psutil>=6.0",
    "platformdirs>=4.2",
    # Platform adapter de macOS (NSWorkspace / Quartz). Solo se instala en macOS.
    "pyobjc-framework-Cocoa>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.3; sys_platform == 'darwin'",
    # M3–M4: cámara + computer vision (todo on-device).
    "numpy>=2.0",
    "opencv-python>=4.10",
    "mediapipe>=0.10.14",
    # M5: tray + dashboard local.
    "pystray>=0.19",
    "pillow>=10.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",  # FastAPI lo necesita para leer formularios HTML (Form)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",  # lo usa fastapi.testclient.TestClient
]

[project.scripts]
nublock = "nublock.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nublock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Starlette sugiere `httpx2` para su TestClient; seguimos con httpx (DECISIONS.md #64).
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# *.md: ruff también formatea bloques de código dentro de Markdown; PRD.md no se toca.
extend-exclude = [".venv", "*.md"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: bugbear,
# ANN: exige type hints en todas las funciones (requisito del PRD).
select = ["E", "W", "F", "I", "UP", "B", "ANN"]
ignore = ["ANN401"]
