<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Nublock{% endblock %}</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #ffffff; --text: #1d2430; --muted: #6b7380; --border: #e2e5ea;
      --productive: #2e9e5b; --neutral: #8a94a6; --distracting: #e0533d; --idle: #d5d9e0;
      --accent: #2f6fde;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171c; --card: #1d2128; --text: #e6e8eb; --muted: #9aa3b0; --border: #2c323b;
        --idle: #3a404a;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    header { display: flex; gap: 20px; align-items: baseline; padding: 18px 24px; }
    header h1 { margin: 0; font-size: 20px; }
    header a { color: var(--accent); text-decoration: none; }
    main { max-width: 1100px; margin: 0 auto; padding: 0 16px 40px; display: grid; gap: 16px; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; }
    .card h2 { margin: 0 0 12px; font-size: 15px; color: var(--muted); font-weight: 600; }
    .big { font-size: 28px; font-weight: 650; }
    .muted { color: var(--muted); }
    .row { display: grid; grid-template-columns: 130px 1fr 70px; gap: 10px; align-items: center; margin: 6px 0; }
    .bar { height: 12px; border-radius: 6px; background: var(--idle); overflow: hidden; }
    .bar > span { display: block; height: 100%; }
    .productive { background: var(--productive); } .neutral { background: var(--neutral); }
    .distracting { background: var(--distracting); } .idle { background: var(--idle); }
    .timeline { position: relative; height: 34px; background: var(--bg); border-radius: 6px; overflow: hidden; }
    .timeline > span { position: absolute; top: 0; bottom: 0; min-width: 1px; }
    .hours { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 4px; }
    table { width: 100%; border-collapse: collapse; }
    td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--border); font-size: 14px; }
    form.inline { display: inline-flex; gap: 6px; align-items: center; margin: 0; }
    button, select, input { font: inherit; padding: 5px 9px; border-radius: 6px; border: 1px solid var(--border);
                            background: var(--card); color: var(--text); }
    button { cursor: pointer; } button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; }
    .pill { display: inline-block; padding: 2px 10px; border-radius: 99px; background: var(--bg); font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <h1>Nublock</h1>
    <a href="/">Hoy</a>
    <a href="/week">Semana</a>
    <span class="muted">Todo local · 127.0.0.1</span>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
